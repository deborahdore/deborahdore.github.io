# --- Selected research (featured, horizontal cards) ---------------------------

- title: FallacyRAG
  id: fallacyrag
  category: Selected research
  year: 2026
  note: Under review at EACL 2027
  img: publication_preview/fallacyrag.webp
  page: /projects/fallacyrag/
  description: "Retrieval-augmented fallacy detection and classification in US political debates, with retrieval steered by the support and attack relations between arguments. Improves macro-F1 up to 0.864 for detection and 0.725 for classification over non-retrieval baselines."
  tags: [Python, RAG, LLMs, Argument mining]
  links:
    - {label: Paper, url: "https://arxiv.org/abs/2608.27471"}
    - {label: Code, url: "https://github.com/deborahdore/FallacyRAG"}

- title: RooseBERT
  id: roosebert
  category: Selected research
  year: 2025–2026
  note: WI-IAT 2026
  img: publication_preview/roosebert.jpeg
  page: /projects/roosebert/
  description: "A BERT language model for political discourse, pre-trained on 11 GB of English debates and speeches (cased and uncased, from scratch or by continued pre-training). Outperforms general-purpose models on most downstream tasks, from stance detection to NER."
  tags: [Python, BERT, Pre-training, Hugging Face]
  badges:
    - {alt: GitHub stars, img: "https://img.shields.io/github/stars/deborahdore/RooseBERT?style=flat&logo=github&label=stars&color=6B48FF", url: "https://github.com/deborahdore/RooseBERT"}
    - {alt: Models on Hugging Face, img: "https://img.shields.io/badge/Hugging_Face-4_models-FFD21E?logo=huggingface&logoColor=black", url: "https://huggingface.co/collections/ddore14/roosebert"}
  links:
    - {label: Paper, url: "https://arxiv.org/abs/2508.03250"}
    - {label: Models, url: "https://huggingface.co/collections/ddore14/roosebert"}
    - {label: Code, url: "https://github.com/deborahdore/RooseBERT"}

- title: DISPUTool
  id: disputool
  category: Selected research
  year: 2025
  note: ACL 2025 (Demo Track)
  img: publication_preview/disputool.webp
  page: /projects/disputool/
  description: "A web tool for mining and exploring arguments in US presidential debates (1960-2020), built at Inria and 3IA Côte d'Azur. DISPUTool 3.0 adds a module that detects and classifies fallacious arguments and shows how each argument reads once the fallacy is repaired."
  tags: [Web demo, Argument mining, Fallacies, LLMs]
  links:
    - {label: Try the demo, url: "https://3ia-demos.inria.fr/disputool/"}
    - {label: Paper, url: "https://doi.org/10.18653/v1/2025.acl-demo.45"}
    - {label: Poster, url: "/assets/poster/poster_disputool.pdf"}

