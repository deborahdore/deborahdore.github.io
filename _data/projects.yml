  category: Research
  note: Dataset (fork)
  description: "Annotated corpus of US presidential debates (1960-2020) with argument components, support and attack relations, and fallacies. A fork of the public dataset repository, which my work on fallacy detection and relation prediction builds on."
  tags: [Dataset, Argument mining, Fallacies]
  links:
    - {label: Code, url: "https://github.com/deborahdore/ElecDeb60to20"}

